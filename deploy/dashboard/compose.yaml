name: wekeeper
services:
  api:
    build:
      context: ../..
      dockerfile: deploy/dashboard/Dockerfile
      args:
        WEKEEPER_BASE_PATH: ${WEKEEPER_BASE_PATH:-/}
    restart: unless-stopped
    env_file: .env
    environment:
      WEKEEPER_DATA_DIR: /data
      WEKEEPER_STATIC_DIR: /app/web
    volumes:
      - ./runtime/data:/data
      - ./runtime/backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEKEEPER_HTTPS_PORT:-443}:443"
      - "80:80"
    volumes:
      - ./runtime/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./runtime/acme:/var/www/acme:ro
      - ./runtime/letsencrypt:/etc/letsencrypt:ro
  certbot:
    image: certbot/certbot:v5.4.0
    profiles: ["certificate"]
    volumes:
      - ./runtime/acme:/var/www/acme
      - ./runtime/letsencrypt:/etc/letsencrypt
