name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Configure private test state
        run: printf 'CHATLOG_KEEPER_DATA_DIR=%s/wekeeper-private-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install development and build dependencies
        run: python -m pip install -e '.[dev,mcp,web]' build
      - name: Run synthetic and mocked-desktop regression tests
        run: python -m pytest -q
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check release contents and unpack source distribution
        shell: bash
        run: |
          python scripts/check_release_artifacts.py dist/*
          mkdir "$RUNNER_TEMP/wekeeper-source"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/wekeeper-source" --strip-components=1
      - name: Test and build frontend from the source distribution
        shell: bash
        run: |
          cd "$RUNNER_TEMP/wekeeper-source/frontend"
          npm ci
          npm test
          npm run build -- --base=/wekeeper/
      - name: Verify installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wekeeper-wheel"
          wheel="$(python -c 'import glob; print(glob.glob("dist/*.whl")[0])')"
          "$RUNNER_TEMP/wekeeper-wheel/bin/python" -m pip install "${wheel}[mcp,web]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wekeeper-wheel/bin/chatlog-keeper" --help
          "$RUNNER_TEMP/wekeeper-wheel/bin/wekeeper-dashboard" --help
          "$RUNNER_TEMP/wekeeper-wheel/bin/python" - <<'PY'
          import asyncio
          import importlib.metadata
          from chatlog_keeper import __version__
          from chatlog_keeper.dashboard.api import create_app
          from chatlog_keeper.mcp_server import create_server
          assert importlib.metadata.version("chatlog-keeper") == __version__ == "0.6.0"
          assert callable(create_app)
          tools = asyncio.run(create_server().list_tools())
          assert len(tools) == 15
          assert sum(not tool.annotations.readOnlyHint for tool in tools) == 1
          PY
