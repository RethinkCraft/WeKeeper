name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      version: ${{ steps.release-assets.outputs.version }}
      release_tag: ${{ steps.release-assets.outputs.release_tag }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Configure private test state
        run: printf 'CHATLOG_KEEPER_DATA_DIR=%s/wekeeper-private-state\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install development and build dependencies
        run: python -m pip install -e '.[dev,mcp,web,bot]' build
      - name: Run offline regression tests
        run: python -m pytest -q
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check release contents and unpack source distribution
        shell: bash
        run: |
          python scripts/check_release_artifacts.py dist/*
          mkdir "$RUNNER_TEMP/wekeeper-source"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/wekeeper-source" --strip-components=1
      - name: Verify source distribution without private state or a Git checkout
        shell: bash
        run: |
          cd "$RUNNER_TEMP/wekeeper-source"
          python -m pip install -e '.[dev,mcp,web,bot]'
          python scripts/setup_protocol_gateway.py --verify-lock
          python -m pytest -q
      - name: Test and build frontend from the source distribution
        shell: bash
        run: |
          cd "$RUNNER_TEMP/wekeeper-source/frontend"
          npm ci
          npm test
          npm run build -- --base=/wekeeper/
      - name: Verify installed wheel outside the checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wekeeper-wheel"
          wheel="$(python -c 'import glob; print(glob.glob("dist/*.whl")[0])')"
          "$RUNNER_TEMP/wekeeper-wheel/bin/python" -m pip install "${wheel}[mcp,web,bot]"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wekeeper-wheel/bin/chatlog-keeper" --help
          "$RUNNER_TEMP/wekeeper-wheel/bin/wekeeper-dashboard" --help
          "$RUNNER_TEMP/wekeeper-wheel/bin/wekeeper-bot" --help
          "$RUNNER_TEMP/wekeeper-wheel/bin/wekeeper-bot" check --help
          "$RUNNER_TEMP/wekeeper-wheel/bin/python" - <<'PY'
          import asyncio
          import importlib.metadata
          from chatlog_keeper import __version__
          from chatlog_keeper.dashboard.api import create_app
          from chatlog_keeper.mcp_server import create_server
          from chatlog_keeper.bot.protocol_runtime import check_configuration
          assert importlib.metadata.version("chatlog-keeper") == __version__ == "0.7.0"
          assert callable(create_app)
          assert callable(check_configuration)
          tools = asyncio.run(create_server().list_tools())
          assert len(tools) == 15
          assert sum(not tool.annotations.readOnlyHint for tool in tools) == 1
          PY
      - name: Prepare verified release assets
        id: release-assets
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          import re
          import tomllib

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*", version)
          names = [f"chatlog_keeper-{version}.tar.gz", f"chatlog_keeper-{version}-py3-none-any.whl"]
          checksums = "".join(f"{hashlib.sha256((Path('dist') / name).read_bytes()).hexdigest()}  {name}\n" for name in names)
          Path("dist/SHA256SUMS").write_text(checksums)
          subject = os.environ["COMMIT_MESSAGE"].split("\n", 1)[0]
          release = (os.environ["EVENT_NAME"] == "push"
                     and os.environ["EVENT_REF"] == "refs/heads/main"
                     and subject == f"release: v{version}")
          if release:
              assert Path(f"docs/releases/{version}.md").is_file(), "Release notes are required"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
              output.write(f"release_tag={'v' + version if release else ''}\n")
          PY
      - name: Retain verified source distribution and wheel
        id: upload
        uses: actions/upload-artifact@v6
        with:
          name: wekeeper-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/chatlog_keeper-${{ steps.release-assets.outputs.version }}.tar.gz
            dist/chatlog_keeper-${{ steps.release-assets.outputs.version }}-py3-none-any.whl
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.test-and-build.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ needs.test-and-build.outputs.artifact_id }}
          path: dist
          merge-multiple: true
      - name: Verify downloaded checksums
        working-directory: dist
        run: sha256sum -c SHA256SUMS
      - name: Publish the verified release without replacing an existing tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.test-and-build.outputs.version }}
          RELEASE_TAG: ${{ needs.test-and-build.outputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tomllib
          import urllib.error
          import urllib.request

          version = os.environ["RELEASE_VERSION"]
          tag = os.environ["RELEASE_TAG"]
          assert tag == "v" + version
          assert version == tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          names = [f"chatlog_keeper-{version}.tar.gz", f"chatlog_keeper-{version}-py3-none-any.whl", "SHA256SUMS"]
          assert {path.name for path in Path("dist").iterdir()} == set(names)
          notes = Path(f"docs/releases/{version}.md")
          assert notes.is_file()
          repo = os.environ["GH_REPO"]
          headers = {"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                     "Accept": "application/vnd.github+json"}
          for endpoint in (f"git/ref/tags/{tag}", f"releases/tags/{tag}"):
              request = urllib.request.Request(f"https://api.github.com/repos/{repo}/{endpoint}", headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30):
                      raise SystemExit(f"Refusing to replace existing {endpoint}")
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
          subprocess.run(["gh", "release", "create", tag, "--repo", repo,
                          "--target", os.environ["GITHUB_SHA"], "--title", f"WeKeeper {tag}",
                          "--notes-file", str(notes), "--latest",
                          *(str(Path("dist") / name) for name in names)], check=True)
          PY
